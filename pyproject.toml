[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tea-chay-advisor"
version = "0.1.0"
description = "今天喝什么茶 · tea-planner MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.2",
]
license = { text = "MIT" }

[project.scripts]
tea-planner = "tea_planner:main"
tea-chay-advisor = "tea_planner:main"

[project.urls]
Homepage = "https://github.com/blyatman996/Tea-Chay-Advisor"
Repository = "https://github.com/blyatman996/Tea-Chay-Advisor"

[tool.setuptools]
py-modules = ["tea_planner"]
